# 追加策略：二八轮动（M3-S4）
s4_erba_rotation:
  enabled: true
  pool:
    - { code: "sh000300", name: "沪深300", etf_code: "510300", etf_name: "沪深300ETF" }
    - { code: "sh000905", name: "中证500", etf_code: "510500", etf_name: "中证500ETF" }
  signal_basis: "month_end_close"   # 月末判信号
  lookback_days: 20                  # 动量回看（预注册经典值，不调）
  rebalance: "monthly"               # 月频
  rule: "选 lookback_days 收益最高者持有；trend filter 可选"
  trend_filter_ma: null              # 默认无 trend filter，敏感性单独跑
  allow_cash: false                  # 经典版总在二者之一中（不进现金）
  # 经济学先验：A股大小盘风格切换有不同行情驱动(大盘=机构定价/小盘=流动性)，
  # 简单动量轮动是经典叙事。非数据挖掘。

s5_small_cap:                         # 经典小市值策略（2017 前曾是 A 股"圣杯"）
  enabled: true
  rebalance: "monthly"                # 月末调仓，下月初开盘成交
  hold_n: 10                          # 持有最小市值 N 只
  exclude_st: true                    # 剔除 ST/退市风险股
  exclude_new_days: 60                # 剔除上市不足 60 日
  min_price: 1.0                      # 剔除 1 元以下面值股
  max_market_cap_rank_pct: null       # 无上限,按市值升序取前 hold_n
  weight: "equal"                     # 等权
  # 经济学先验：小市值溢价(SMB)是经典风险因子(Fama-French),A股注册制前小盘股流动性溢价显著。
  # 假设：2017 年(注册制改革+小盘股流动性折价)后该 edge 显著衰减。
  # 测试它从"圣杯"到"陷阱"的全过程,正是反诈/自用判断核心价值。

s6_dual_ma_crossover:                  # 经典双均线策略（散户技术指标入门头牌）
  enabled: true
  asset: "sh000300"                    # 主测沪深300指数（最具代表性）
  signal_basis: "daily_close"          # D 日收盘后判信号
  short_ma: 5                          # 5日均线（经典快线）
  long_ma: 20                          # 20日均线（经典慢线）
  rule: "短均上穿长均=买入 / 短均下穿长均=卖出/空仓"
  rebalance_when: "crossover_only"     # 仅在交叉发生时换仓（低换手）
  allow_short: false                   # 仅多空(持有/现金)，不做空
  # 经济学先验：双均线是技术分析教科书第一课、散户入门必学。
  # 假设：在有效市场上，公开的简单技术指标无法稳定 alpha，且在 A 股牛熊切换中
  # 必产生"高位金叉买在顶、低位死叉卖在底"的反向 whipsaw。
  # 也跑 sh000905 中证500 与 510300 沪深300ETF 作敏感性。

s7_limit_up_followup:                  # 涨停板次日接力（散户"打板战法"核心）
  enabled: true
  rebalance: "daily_signal"            # 每日扫描
  signal: "yesterday_limit_up"         # D-1 日涨停的股票
  buy_time: "D_open"                   # 次日开盘买入(模拟"打板族"无脑追涨)
  hold_period_days: 1                  # 持有 1 个交易日,D+1 开盘卖出
  max_positions: 3                     # 最多持 3 只(打板族常态)
  exclude_st: true                     # 剔除 ST
  exclude_new_days: 60                 # 剔除上市<60日
  prefilter_min_amount: 5.0e8          # 涨停当日成交额 >5亿(过滤无量涨停)
  # 经济学先验：A股涨停后短期惯性 vs 次日获利了结 / 一字涨停买不进。
  # 假设：扣费+5元地板+滑点+一字涨停买不进+次日跌停卖不掉 → 真实期望负。
  # 这是散户"打板族"的核心信仰,反诈价值最高。

s8_rsi_reversal:                       # RSI 超买超卖反转（教科书技术指标 No.2）
  enabled: true
  asset: "sh000300"                    # 主测沪深300（同 S6 对照）
  signal_basis: "daily_close"
  rsi_period: 14                       # RSI 14 日（经典）
  buy_threshold: 30                    # RSI<30 超卖→买
  sell_threshold: 70                   # RSI>70 超买→卖（空仓）
  rule: "RSI 上穿 30 买入；下穿 70 卖出"
  rebalance_when: "crossover_only"
  # 经济学先验：超买超卖反转是教科书第二大技术指标策略（与 S6 双均线呼应）。
  # 假设：A 股长期趋势主导期 RSI 会"超买更超买"，反转信号会被吞噬；震荡市可能有效但成本/whipsaw 吃光。

s9_risk_parity:                        # 风险平价/低波动（学术经典：AQR/Asness）
  enabled: true
  rebalance: "monthly"                 # 月频再平衡
  pool:                                # 多资产池(可投资 ETF + 国债 ETF 提供低 vol 资产)
    - { code: "510300", name: "沪深300ETF" }
    - { code: "510500", name: "中证500ETF" }
    - { code: "512880", name: "证券ETF" }
    - { code: "512800", name: "银行ETF" }
    - { code: "159995", name: "芯片ETF" }
    - { code: "512010", name: "医药ETF" }
    - { code: "511010", name: "国债ETF" }    # 低波动资产,关键
  lookback_vol_days: 60                # 60 日波动率窗口
  weight_method: "inverse_volatility"  # 经典 ERC 简化版:权重 ∝ 1/σ_i
  weight_normalize: true               # sum(w)=1
  allow_short: false
  # 经济学先验：风险平价是 AQR/Bridgewater 等顶级机构核心配置(Asness 论文支撑)。
  # 假设：A 股 ETF 池里波动率排序与收益率排序常常错位,反而存在"低波动陷阱"
  # ——低波动股是冷股/僵尸股,把权重给它们会拖累整体。验证是否真有"少亏"效果。

s9b_low_vol_stock_picking:             # S9 变体：纯股票低波动选股(对比 ETF 版)
  enabled: false                       # 先做 ETF 版,验证后再开
  rebalance: "monthly"
  hold_n: 20
  lookback_vol_days: 120
  pool: "csi300_constituents"

s10_pairs_trading:                     # 配对交易/协整套利（市场中性,学术经典）
  enabled: true
  rebalance: "daily_signal"            # 每日检查 z-score
  universe: "csi300_constituents"      # 沪深300成分股(从 PIT panel 流动性子集中筛)
  formation_window_days: 252           # 1 年训练窗口选配对
  trading_window_days: 126             # 6 个月交易窗口
  selection_method: "engle_granger"    # Engle-Granger 协整检验
  num_pairs: 5                         # 选 5 对协整最强配对
  entry_z: 2.0                         # |z| ≥ 2 入场
  exit_z: 0.5                          # |z| ≤ 0.5 平仓
  stop_z: 3.5                          # |z| ≥ 3.5 止损(协整失效)
  pair_capital_pct: 0.20               # 每对 20% 资本(5 对满仓)
  allow_short: false                   # ⚠️ A 股做空困难,先做"只多腿"近似版
                                       # short_leg 不真做空,改为"避开高估侧+只买低估侧"
  # 经济学先验：配对协整套利在美股市场中性,A股因①做空困难②协整不稳定③政策冲击大,
  # 预期 alpha 远不如美股。验证 A 股市场中性策略是否在散户层面可行。
  # 反诈价值：揭示"市场中性=零风险"的话术陷阱(实际有协整失效风险)。

s11_defensive_composite:               # 防御组合: S3b 趋势防御 + S9 Risk Parity 预注册合成
  enabled: true
  # ==== 核心机制(基于已验证的 partial PASS, 预注册不调参) ====
  trend_signal:
    asset: "sh000300"                  # 用沪深300 指数判趋势(数据更长更稳定)
    ma_len: 200                        # S3b 已验证 MA200 经典预注册值
    rule: "close > MA200 → trend_on / 否则 trend_off"
  pool_when_trend_on:                  # 趋势 PASS 时用 S9 Risk Parity 配权
    - { code: "510300", name: "沪深300ETF" }
    - { code: "510500", name: "中证500ETF" }
    - { code: "512880", name: "证券ETF" }
    - { code: "512010", name: "医药ETF" }
    - { code: "511010", name: "国债ETF" }
  pool_when_trend_off:                 # 趋势 FAIL 时 100% 防御
    - { code: "511010", name: "国债ETF", weight: 1.0 }
  lookback_vol_days: 60                # 同 S9 不调
  rebalance: "monthly"                 # 月末判信号 + 重算权重
  rebalance_trigger:
    - "monthly"                        # 每月末
    - "trend_flip"                     # 趋势翻转时立刻重平衡(快速防御)
  # 经济学先验:
  #   - S3b 趋势防御被 S1-S2017 多熊市 OOS 验证(2018/2022 资本保全)
  #   - S9 Risk Parity OOS PASS(expectancy/PF/DD 全过)
  #   - 合成: 趋势在=风险加权进攻,趋势出=纯防御。
  # 这不是 OOS 调参,是基于两个独立 partial PASS 机制的预注册合成。
  # 测试假设:如果合成有效,这是项目唯一可能 Gate1 PASS 的策略。

s12_global_risk_parity:                # 跨大类资产 Risk Parity (突破单一 A 股局限)
  enabled: true
  rebalance: "monthly"                 # 月频
  pool:                                # 跨股/债/海外/商品大类
    - { code: "510300", name: "沪深300ETF", class: "a_share_large" }
    - { code: "510500", name: "中证500ETF", class: "a_share_mid" }
    - { code: "159920", name: "恒生ETF", class: "hk_share" }
    - { code: "513100", name: "纳指ETF", class: "us_share" }
    - { code: "513500", name: "标普500ETF", class: "us_share_alt" }
    - { code: "518880", name: "黄金ETF", class: "commodity" }
    - { code: "511010", name: "国债ETF", class: "bond" }
  lookback_vol_days: 60                # 同 S9 不调
  weight_method: "inverse_volatility"
  weight_normalize: true
  trend_filter: false                  # 不加趋势过滤(避免重蹈 S11 OOS FAIL 覆辙)
  # 经济学先验:
  # 1. 跨大类资产相关性低,risk parity 应优于单一市场版
  # 2. 全球资产对中国宏观风险有自然对冲(美股/纳指/黄金独立周期)
  # 3. 若 S12 OOS PASS, 是项目首个真 Gate1 PASS;若 FAIL, 坐实 A 股散户终局
  # 数据可得性必须先实测(QDII ETF 取数可能有限制)
